services:
  db_usuarios:
    image: postgres:16-alpine
    container_name: uniride_db_usuarios
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: uniride_usuarios_db
    ports:
      - "5431:5432" # Expone en 5431 para no chocar con local 5432 ni con viajes 5433
    volumes:
      - postgres_usuarios_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d uniride_usuarios_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  ms_usuarios:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uniride_ms_usuarios
    restart: always
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql://postgres:password123@db_usuarios:5432/uniride_usuarios_db
      - PORT=8001
      - ENVIRONMENT=docker
    depends_on:
      db_usuarios:
        condition: service_healthy

volumes:
  postgres_usuarios_data:
